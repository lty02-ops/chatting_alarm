apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: chatting-alarm-backend
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - chatting-alarm
  selector:
    matchLabels:
      app: chatting-alarm-backend
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
