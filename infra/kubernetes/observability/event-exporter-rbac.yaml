apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubernetes-event-exporter
  namespace: chatting-alarm
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubernetes-event-exporter
  namespace: chatting-alarm
subjects:
  - kind: ServiceAccount
    name: kubernetes-event-exporter
    namespace: chatting-alarm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubernetes-event-exporter
