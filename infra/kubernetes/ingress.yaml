apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chatting-alarm-ingress
  namespace: chatting-alarm
  labels:
    app: chatting-alarm
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/security-groups: ${ALB_SECURITY_GROUP_ID}
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"

    alb.ingress.kubernetes.io/listen-ports: >-
      [{"HTTP":80},{"HTTPS":443}]

    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: ${ACM_CERTIFICATE_ARN}

    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "3"

    alb.ingress.kubernetes.io/tags: >-
      Name=chatting-alarm-alb,Environment=dev
spec:
  ingressClassName: alb

  rules:
    - host: app.chatting-alarm.p-e.kr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatting-alarm-frontend
                port:
                  number: 80

    - host: api.chatting-alarm.p-e.kr
      http:
        paths:
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: chatting-alarm-backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix
            backend:
              service:
                name: chatting-alarm-backend
                port:
                  number: 8080
