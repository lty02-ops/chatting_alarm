apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatting-alarm-frontend
  namespace: chatting-alarm
  labels:
    app: chatting-alarm-frontend
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0

  selector:
    matchLabels:
      app: chatting-alarm-frontend

  template:
    metadata:
      labels:
        app: chatting-alarm-frontend
    spec:
      serviceAccountName: chatting-alarm-frontend
      automountServiceAccountToken: false

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: chatting-alarm-frontend

      containers:
        - name: frontend
          image: ${FRONTEND_ECR_REPOSITORY_URL}:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
