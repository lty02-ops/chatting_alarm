apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatting-alarm-backend
  namespace: chatting-alarm
  labels:
    app: chatting-alarm-backend
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: chatting-alarm-backend

  template:
    metadata:
      labels:
        app: chatting-alarm-backend
    spec:
      serviceAccountName: chatting-alarm-backend

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: chatting-alarm-backend

      containers:
        - name: backend
          image: ${BACKEND_ECR_REPOSITORY_URL}:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: chatting-alarm-config
            - secretRef:
                name: chatting-alarm-backend-secrets

          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi

          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: chatting-alarm-backend-secrets
